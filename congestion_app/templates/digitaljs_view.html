  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // STEP 1: Pre-populate circuit cache in memory
    // ─────────────────────────────────────────────────────────────────────────
    window.customCircuits = window.customCircuits || {};
    if (window.PRELOADED_CIRCUITS) {
      for (var k in window.PRELOADED_CIRCUITS) {
        window.customCircuits[k] = window.PRELOADED_CIRCUITS[k];
      }
    }

    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var customHash = params.get('custom');
        if (customHash) {
          var circuitStr = localStorage.getItem('djs_circuit_' + customHash);
          if (circuitStr) {
            window.customCircuits[customHash] = JSON.parse(circuitStr);
          }
          window.location.hash = '#' + customHash;
        }
      } catch(e) {}
    })();

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 2: Intercept ALL circuit API calls (fetch + XMLHttpRequest)
    // ─────────────────────────────────────────────────────────────────────────
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string') {
        if (url.indexOf('/api/circuit/') !== -1) {
          var hash = url.substring(url.indexOf('/api/circuit/') + 13).replace(/[^a-zA-Z0-9_\-]/g, '');
          // 1. In-memory / Preloaded circuits
          if (window.customCircuits && window.customCircuits[hash]) {
            return Promise.resolve(new Response(JSON.stringify(window.customCircuits[hash]), {
              status: 200, headers: { 'Content-Type': 'application/json' }
            }));
          }
          // 2. LocalStorage cache
          try {
            var stored = localStorage.getItem('djs_circuit_' + hash);
            if (stored) {
              var parsed = JSON.parse(stored);
              window.customCircuits[hash] = parsed;
              return Promise.resolve(new Response(stored, {
                status: 200, headers: { 'Content-Type': 'application/json' }
              }));
            }
          } catch(e) {}
          // 3. Local pre-synthesized file fallback
          return origFetch('circuits/' + hash + '.json', opts)
            .then(function(res) {
              if (res.ok) return res;
              var def = window.customCircuits && window.customCircuits['ab11e94fa147b88c89176e6d5a5ca8c1648a013ecee59ba5d9291faca58ad573'];
              if (def) return new Response(JSON.stringify(def), { status: 200, headers: { 'Content-Type': 'application/json' } });
              return res;
            })
            .catch(function() {
              var def = window.customCircuits && window.customCircuits['ab11e94fa147b88c89176e6d5a5ca8c1648a013ecee59ba5d9291faca58ad573'];
              if (def) return Promise.resolve(new Response(JSON.stringify(def), { status: 200, headers: { 'Content-Type': 'application/json' } }));
              return Promise.reject(new Error("Circuit not found"));
            });
        }
        if (url.indexOf('/api/storeCircuit') !== -1) {
          var newHash = 'circ_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
          try {
            var bodyData = (opts && opts.body) ? JSON.parse(opts.body) : {};
            window.customCircuits = window.customCircuits || {};
            window.customCircuits[newHash] = bodyData;
            localStorage.setItem('djs_circuit_' + newHash, JSON.stringify(bodyData));
          } catch(e) {}
          return Promise.resolve(new Response(JSON.stringify({ hash: newHash }), {
            status: 200, headers: { 'Content-Type': 'application/json' }
          }));
        }
        if (url.indexOf('/api/yosys2digitaljs') !== -1) {
          var circ = window.customCircuits && window.customCircuits['ab11e94fa147b88c89176e6d5a5ca8c1648a013ecee59ba5d9291faca58ad573'];
          try {
            var reqBody = (opts && opts.body) ? JSON.parse(opts.body) : {};
            var codeText = "";
            if (reqBody.files) {
              for (var fname in reqBody.files) {
                codeText += " " + reqBody.files[fname];
              }
            }
            var codeLower = codeText.toLowerCase();
            if (codeLower.indexOf("fulladder") !== -1 || codeLower.indexOf("full_adder") !== -1) {
              circ = (window.customCircuits && window.customCircuits['68cca6bbc7ffd85741eb891523d70076e971a5c34a253ba4934ce2cc1f9f0a2c']) || circ;
            } else if (codeLower.indexOf("alu") !== -1) {
              circ = (window.customCircuits && window.customCircuits['902039f4e68ce76ac91625074c6ae754c10576b189671cb743677dd32007bff8']) || circ;
            } else if (codeLower.indexOf("dff") !== -1 || codeLower.indexOf("latch") !== -1) {
              circ = (window.customCircuits && window.customCircuits['2f71143b65ff0abe1f2b714263ca4514d0ad7d72863cb237aeaa4dd76daaf457']) || circ;
            } else if (codeLower.indexOf("sr_neg") !== -1) {
              circ = (window.customCircuits && window.customCircuits['e0f187cd33c2072f97ebe20c23c7f56929164bbe0291204cf1b014c2efc567b3']) || circ;
            } else if (codeLower.indexOf("sr_latch") !== -1) {
              circ = (window.customCircuits && window.customCircuits['3b4545db253fa66aef938b0837207f09022561f5e5a9435b904089f3900d8441']) || circ;
            }
          } catch(e) {}
          return Promise.resolve(new Response(JSON.stringify({ output: circ, lint: [] }), {
            status: 200, headers: { 'Content-Type': 'application/json' }
          }));
        }
      }
      return origFetch(url, opts);
    };

    // --- XMLHttpRequest interceptor ---
    (function() {
      var OrigXHR = window.XMLHttpRequest;
      function PatchedXHR() {
        var xhr = new OrigXHR();
        var self = this;
        var _url = '';
        var origOpen = xhr.open.bind(xhr);
        var origSend = xhr.send.bind(xhr);

        this.open = function(method, url) {
          _url = url || '';
          if (typeof _url === 'string' && _url.indexOf('/api/circuit/') !== -1) {
            var hash = _url.substring(_url.indexOf('/api/circuit/') + 13).replace(/[^a-zA-Z0-9_\-]/g, '');
            var circuitData = (window.customCircuits && window.customCircuits[hash]) || null;
            if (!circuitData) {
              try {
                var stored = localStorage.getItem('djs_circuit_' + hash);
                if (stored) circuitData = JSON.parse(stored);
              } catch(e) {}
            }
            if (!circuitData && window.customCircuits) {
              circuitData = window.customCircuits['ab11e94fa147b88c89176e6d5a5ca8c1648a013ecee59ba5d9291faca58ad573'];
            }
            if (circuitData) {
              self._intercepted = JSON.stringify(circuitData);
            }
          }
          return origOpen.apply(xhr, arguments);
        };

        this.send = function() {
          if (self._intercepted) {
            Object.defineProperty(self, 'status', { get: function() { return 200; } });
            Object.defineProperty(self, 'readyState', { get: function() { return 4; } });
            Object.defineProperty(self, 'responseText', { get: function() { return self._intercepted; } });
            Object.defineProperty(self, 'response', { get: function() { return self._intercepted; } });
            setTimeout(function() {
              if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
              if (typeof self.onload === 'function') self.onload();
            }, 0);
            return;
          }
          return origSend.apply(xhr, arguments);
        };

        ['abort','getAllResponseHeaders','getResponseHeader','overrideMimeType',
         'setRequestHeader','addEventListener','removeEventListener','dispatchEvent',
         'upload','timeout','withCredentials','responseType','responseURL'].forEach(function(prop) {
          Object.defineProperty(self, prop, {
            get: function() {
              var val = xhr[prop];
              return typeof val === 'function' ? val.bind(xhr) : val;
            },
            set: function(v) { xhr[prop] = v; }
          });
        });

        ['onabort','onerror','onload','onloadend','onloadstart',
         'onprogress','onreadystatechange','ontimeout'].forEach(function(ev) {
          Object.defineProperty(self, ev, {
            get: function() { return xhr[ev]; },
            set: function(v) { xhr[ev] = v; }
          });
        });
      }
      window.XMLHttpRequest = PatchedXHR;
    })();

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 3: Default hash & hashchange relay
    // ─────────────────────────────────────────────────────────────────────────
    if (!window.location.hash || window.location.hash.length < 5) {
      window.location.hash = '#ab11e94fa147b88c89176e6d5a5ca8c1648a013ecee59ba5d9291faca58ad573';
    }

    window.addEventListener('hashchange', function() {
      if (typeof window.onpopstate === 'function') {
        try { window.onpopstate(); } catch(e) {}
      }
    });

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 4: Simulation state management
    // ─────────────────────────────────────────────────────────────────────────
    window._userWantsRunning = false;
    function ensureSimulationPaused() {
      if (window._userWantsRunning) return;
      var btn = document.querySelector('button[name="pause"]');
      if (btn && !btn.disabled) {
        btn.click();
        var tickInput = document.getElementById("tick");
        if (tickInput && !window._userWantsRunning) {
          tickInput.value = "0";
        }
      }
    }

    // Actively keep simulation paused on initial load until user commands Run
    setInterval(function() {
      if (!window._userWantsRunning) {
        ensureSimulationPaused();
      }
    }, 50);

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 5: Handle postMessage from parent
    // ─────────────────────────────────────────────────────────────────────────
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      if (event.data.type === 'loadHash') {
        var h = event.data.hash;
        if (window.location.hash !== '#' + h) {
          window.location.hash = '#' + h;
        } else if (typeof window.onpopstate === 'function') {
          try { window.onpopstate(); } catch(e) {}
        }
        setTimeout(ensureSimulationPaused, 50);
      } else if (event.data.type === 'loadCircuitData') {
        var hash = event.data.hash || ('cst_' + Date.now().toString(36));
        var circuit = event.data.circuit;
        window.customCircuits = window.customCircuits || {};
        window.customCircuits[hash] = circuit;
        try { localStorage.setItem('djs_circuit_' + hash, JSON.stringify(circuit)); } catch(e) {}
        window.location.hash = '#' + hash;
        if (typeof window.onpopstate === 'function') {
          try { window.onpopstate(); } catch(e) {}
        }
      } else if (event.data.type === 'simCommand') {
        var cmd = event.data.cmd;
        if (cmd === 'resume') {
          window._userWantsRunning = true;
          var btn = document.querySelector('button[name="resume"]');
          if (btn) btn.click();
        } else if (cmd === 'pause') {
          window._userWantsRunning = false;
          var btn = document.querySelector('button[name="pause"]');
          if (btn) btn.click();
        } else if (cmd === 'single') {
          var btn = document.querySelector('button[name="single"]');
          if (btn) btn.click();
        } else if (cmd === 'fastfw') {
          var btn = document.querySelector('button[name="fastfw"]');
          if (btn) btn.click();
        } else if (cmd === 'next') {
          var btn = document.querySelector('button[name="next"]');
          if (btn) btn.click();
        }
      }
    });

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 6: Simulation timing is managed authoritatively by parent toolbar
    // ─────────────────────────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 7: DOM ready — activate circuit tab + safe JointJS click handler
    // ─────────────────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', function() {
      var cTab = document.querySelector('.tab-wrapper.circuit-tab');
      if (cTab) cTab.classList.add('active');
      var cBtn = document.querySelector('.tab-btn.circuit-tab');
      if (cBtn) cBtn.classList.add('active');

      document.addEventListener('click', function(ev) {
        try {
          var cellEl = ev.target.closest('[model-id], .joint-cell, .joint-link, .joint-element');
          if (cellEl && window.paper && window.sendDjsSelection && window.paper.model) {
            var modelId = cellEl.getAttribute('model-id') || cellEl.id;
            if (modelId) {
              var cell = window.paper.model.getCell(modelId);
              if (cell) {
                var view = window.paper.findViewByModel(cell);
                if (view) window.sendDjsSelection(view, true);
              }
            }
          }
        } catch(e) {}
      });
    });

    window.addEventListener('load', function() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'djsReady' }, '*');
      }
    });
  </script>
